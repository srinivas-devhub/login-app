<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — AuthApp</title>
  <meta name="description" content="Create a new AuthApp account." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="card">

    <!-- Logo / Header -->
    <div class="logo">
      <div class="logo-icon">✨</div>
      <h1>Create Account</h1>
      <p>Register to get started</p>
    </div>

    <!-- Alert message box (shown by JavaScript on error/success) -->
    <div id="alert-box" class="alert"></div>

    <!-- Registration Form -->
    <form id="register-form">

      <div class="form-group">
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Your full name"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="srinivas@example.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Minimum 6 characters"
          required
        />
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input
          type="password"
          id="confirm-password"
          name="confirm-password"
          placeholder="Re-enter your password"
          required
        />
      </div>

      <button type="submit" id="register-btn" class="btn btn-primary">
        Create Account
      </button>

    </form>

    <!-- Footer link to Login page -->
    <p class="footer-text">
      Already have an account? <a href="index.html">Sign in</a>
    </p>

  </div>

  <script src="script.js"></script>
</body>
</html>
