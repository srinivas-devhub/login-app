<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — AuthApp</title>
  <meta name="description" content="Login to your AuthApp account securely." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="card">

    <!-- Logo / Header -->
    <div class="logo">
      <div class="logo-icon">🔐</div>
      <h1>Welcome Back</h1>
      <p>Sign in to your account</p>
    </div>

    <!-- Alert message box (shown by JavaScript on error/success) -->
    <div id="alert-box" class="alert"></div>

    <!-- Login Form -->
    <form id="login-form">

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="srinivas@example.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
        />
      </div>

      <button type="submit" id="login-btn" class="btn btn-primary">
        Sign In
      </button>

    </form>

    <!-- Footer link to Register page -->
    <p class="footer-text">
      Don't have an account? <a href="register.html">Create one</a>
    </p>

  </div>

  <script src="script.js"></script>
</body>
</html>
